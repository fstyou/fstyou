# Save as .github/workflows/metrics.yml
name: Metrics
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Image 1
      - name: Generate profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: fstyou
          filename: metrics-profile.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: regular
          config_octicon: yes
          config_timezone: Asia/Shanghai
          plugin_code: yes
          plugin_code_days: 3
          plugin_code_lines: 10
          plugin_code_load: 400
          plugin_code_visibility: public
          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_indepth: yes
          plugin_followup_sections: repositories
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 10
          plugin_languages_other: yes
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_stars: yes
          plugin_stars_limit: 4
          plugin_lines: yes
          plugin_lines_history_limit: 5
          plugin_lines_repositories_limit: 5
          plugin_lines_sections: base
          repositories_forks: yes

      # Image 2
      - name: Generate social metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: fstyou
          filename: metrics-social.svg
          template: classic
          base: ""
          config_display: regular
          config_octicon: yes
          config_timezone: Asia/Shanghai
          plugin_repositories: yes
          plugin_repositories_pinned: 6
          plugin_repositories_order: pinned
          plugin_repositories_forks: yes
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: classic
          plugin_stargazers_days: 14
          plugin_people: yes
          plugin_people_limit: 25
          plugin_people_size: 25
          plugin_people_types: followers, following
          plugin_reactions: yes
          plugin_reactions_display: absolute
          plugin_reactions_limit: 200
          plugin_reactions_limit_discussions: 100
          plugin_reactions_limit_discussions_comments: 100
          plugin_reactions_limit_issues: 100
